# SVS overlay — merged after config/base_hdr.yml (see util.config_merge.pipeline_config_paths).

sensor_info:
  sensor: "SVS"

black_level_correction:
  is_enable: true

digital_gain:
  is_debug: true

lens_shading_correction:
  is_enable: true

white_balance:
  r_gain: 1.2
  b_gain: 1.34

color_correction_matrix:
  corrected_red: [1.1604, 0.0462, -0.2067]
  corrected_green: [-0.2355, 1.5297, -0.2943]
  corrected_blue: [0.0594, -0.3915, 1.3321]

auto_exposure:
  is_enable: true

color_saturation_enhancement:
  saturation_gain: 1.8

tone_mapping:
  tone_mapper: durand

aces_integer:
  exposure_adjustment: -2.0
