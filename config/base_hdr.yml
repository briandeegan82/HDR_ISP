# Merge base for HDR-style pipeline. Camera files named *_cam.yml load after this file automatically.
# Override per camera at least: platform.filename, sensor_info (size, bayer, sensor name), and calibrated blocks (BLC, CCM, LSC, companding) as needed.

platform:
  filename: "frame_0000.raw"
  disable_progress_bar: false
  leave_pbar_string: false
  render_3a: false
  # npy, png or both
  save_format: png
  short_output_names: true  # compact filenames: {in_file}_{timestamp}.png
  # skip_disabled_modules: true  # skip instantiating disabled modules (performance)
  # Global debug settings
  debug_enabled: true # Set to true to enable debug logging
  debug_log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  debug_log_file: null  # Set to filename to save logs to file (e.g., "isp_debug.log")
  # Histogram debug settings
  plot_histograms: true  # Plot histograms of input (after decompanding) and output images
  histogram_show_log: true  # Show log scale histograms in addition to linear
  histogram_show_channels: false  # For output RGB, show separate R/G/B histograms

sensor_info:
  bayer_pattern: "gbrg"
  #range: 65536
  hdr_bit_depth: 24
  bit_depth: 12
  pipeline_rgb_bit_depth: 16  # RGB stages (demosaic→CCM→CSC→YUV processing→RGB conversion→gamma)
  width: 1920
  height: 1563
  output_bit_depth: 8
  sensor: "base_camera"
  endian_type: "ieee-be"
  data_format: "uint16"
  embedded_rows_top: 0
  embedded_rows_bottom: 0

# Default companding knees (SVS-style; first pin 1 matches PiecewiseCurve.generate_decompanding_lut).
# Override companding entirely for sensors that do not use this curve.
companding:
  is_enable: true
  is_debug: false
  pedestal: 240
  companded: true
  companded_pin: [1, 256, 512, 831, 994, 1319, 1984, 2530, 2871, 2968, 3258, 3541, 3855]
  companded_pout: [1, 256, 1024, 3900, 7800, 23400, 87315, 174630, 349260, 548241, 1736000, 5208000, 16777200]
  is_save: false

crop:
  is_enable: false
  is_debug: false
  crop_x_start: 1220
  crop_y_start: 440
  new_width: 300
  new_height: 300
  is_save: false  

dead_pixel_correction: 
  is_enable: true
  dp_threshold: 64
  is_debug: false
  is_save: false

black_level_correction:
  is_enable: false
  r_offset: 16
  gr_offset: 16
  gb_offset: 16
  b_offset: 16
  is_linear: false # to do - add linearization
  r_sat: 4095
  gr_sat: 4095
  gb_sat: 4095
  b_sat: 4095
  is_save: false

oecf:
  is_enable: false
  # Make sure the LUT has the right bit range i.e. if image is of 10 bit LUT should be from [0 - (2^10)-1]
  # LUT here does nothing to the sensor response i.e. a value of 800 maps to 800 and 2000 maps to 2000  
  
  is_save: false

digital_gain:
  is_debug: false
  is_auto: false
  is_enable: true
  # Array of pre-define Gains
  gain_array: [0.03125, 0.0625, 0.125, 0.25, 0.5, 1, 2, 4, 6, 8, 10, 12, 16, 32, 64]
  # Index of default gain
  current_gain: 10
  ae_feedback: 0
  is_save: false

# If you see a vertical color seam or split tones, try is_enable: false — k1/k2 below are huge vs the 0.1–0.4 range in the comment block (possible config typo).
lens_shading_correction:
  is_enable: false
  is_save: false
  # Radial polynomial: gain(r) = 1 + k1*r² + k2*r⁴; r=0 at center, 1 at corners
  # Increase k1/k2 to correct stronger vignetting (typical: k1 0.1-0.4, k2 0.05-0.2)
  r_k1: 4.25
  r_k2: 4.08
  gr_k1: 4.12
  gr_k2: 4.16
  gb_k1: 4.12
  gb_k2: 4.16
  b_k1: 4.25
  b_k2: 4.08

bayer_noise_reduction:
  is_enable: true
  filter_window: 5
  r_std_dev_s: 0.8
  r_std_dev_r: 0.15
  g_std_dev_s: 0.8
  g_std_dev_r: 0.15
  b_std_dev_s: 0.8
  b_std_dev_r: 0.1
  is_save: false

# White balance: AWB estimates R/B gains per frame when auto_white_balance.is_enable.
# white_balance applies those gains (or manual r_gain/b_gain when AWB is off). is_auto is synced from AWB at load.
auto_white_balance:
  is_enable: true
  is_debug: false
  underexposed_percentage: 0.05
  overexposed_percentage: 0.05
  algorithm: "pca"
  # grey_world, norm_2, pca
  percentage: 3.5 # pca

white_balance:
  is_enable: true
  is_debug: false
  r_gain: 1.0
  b_gain: 1.0
  is_save: false

demosaic:
  is_save: false
  # Algorithm selection:
  # - "bilinear": Simple bilinear interpolation (medium speed, good quality)
  # - "malvar": Malvar-He-Cutler (default, high quality, slower)
  # - "vng_opt": Variable Number of Gradients (high quality, slower)
  # - "hamilton_adams": Hamilton Adams (high quality, slower)
  # - "ppg": Pixel Pattern Gradient (high quality, slower)
  # - "ahd": Adaptive Homogeneity-Directed (high quality, slower)
  # - "lmmse": Least Mean Square Error (high quality, slower)
  algorithm: "bilinear"

color_correction_matrix:
  #Row sum to 1 convention
  is_enable: true
  corrected_red: [1.0, 0.0, 0.0]
  corrected_green: [0.0, 1.0, 0.0]
  corrected_blue: [0.0, 0.0, 1.0]
  is_save: false

gamma_correction:
  is_enable: true
  is_save: false
  curve: 'srgb'   # 'gamma' (power) or 'srgb'
  gamma: 2.2       # Used when curve='gamma'

auto_exposure:
  is_enable: true
  is_debug: false
  center_illuminance: 0.4
  histogram_skewness: 0.9
  # exposure_correction_mode: step   # or direct: pick gain index from meter in one shot (needs digital_gain is_auto)
  target_luminance: 0.5 
                # optional target; fraction [0,1] vs meter full scale, or absolute if >1
  # rerun_from_digital_gain: true  # default for direct: second DG→…→AE pass applies the index from pass 1; set false to only update state for the next run

color_space_conversion: 
  conv_standard: 2
  # Bt.709 HD =   1
  # Bt.601/4407 = 2
  is_save: false

color_saturation_enhancement:
  is_enable: true
  saturation_gain: 1.0

ldci:
  is_enable: false
  clip_limit: 2.0
  wind: 128
  is_save: false

sharpen:
  is_enable: true
  sharpen_sigma: 3.0
  sharpen_strength: 1.0
  is_save: false

2d_noise_reduction:
  is_enable: false
  # nlm
  window_size: 9
  patch_size: 5
  wts: 10
  is_save: false
  
rgb_conversion:
  is_enable: true
  is_save: false

scale:
  is_enable: false
  is_debug: false
  new_width: 1280
  new_height: 1024   
  is_hardware: false
  # Nearest_Neighbor # Bilinear
  algorithm: "Bilinear"
  upscale_method: "Bilinear"
  downscale_method: "Bilinear"  
  is_save: false

yuv_conversion_format:
  # The conversion wont run if csc is false
  is_enable: true
  conv_type: '444'
  is_save: false
  
tone_mapping:
  is_enable: true
  tone_mapping_before_demosaic: true
  tone_mapper: 'reinhard_integer'
  is_save: false

# Reinhard global operator (integer implementation)
# Based on Reinhard et al. 2002 "Photographic Tone Reproduction for Digital Images"
reinhard_integer:
  is_enable: true
  is_plot_curve: true  # Set to true to plot and save the tone mapping curve
  knee: 0.25      # Reinhard white point; larger = more highlight compression
  strength: 1.5  # Modulates white point scaling
  normalize_output: true  # Scale output to use full range (compensates for white point)

# ACES integer/LUT tone mapping (production-style)
aces_integer:
  is_enable: true
  is_plot_curve: true  # Set to true to plot and save the tone mapping curve
  exposure_adjustment: 0.0  # EV
  gamma: 2.4
  apply_odt_gamma: true
  use_normalization: false   # Per-image min-max (matches float ACES, fixes washout)
  normalize_output: false  # Scale output to use full range (compensates for LUT limits)
  hdr_scale: 6.0        # Higher = more compression; 10.0 = very compressed

# Durand: float, local TMO (used when tone_mapper: 'durand')
hdr_durand:
  is_enable: true
  is_save: false
  is_debug: true
  is_plot_curve: true  # Set to true to plot and save the tone mapping curve
  sigma_space: 8.0
  sigma_color: 8.0
  contrast_factor: 2.0
  downsample_factor: 4
  
# Hable (Uncharted 2) filmic tone mapping (float)
hable:
  is_enable: false
  is_save: false
  is_plot_curve: false  # Set to true to plot and save the tone mapping curve
  exposure_bias: 2.0    # Exposure adjustment (higher = brighter)
  white_point: 11.2     # White point (Hable default)

# Hable integer/LUT tone mapping (production-style)
hable_integer:
  is_enable: true
  is_plot_curve: true  # Set to true to plot and save the tone mapping curve
  exposure_bias: 4.0
  white_point: 11.2
  use_normalization: true   # Per-image min-max
  normalize_output: true   # Scale output to use full range (compensates for LUT limits)
  hdr_scale: 2.0       # Lower = more compression

# ACES Tone Mapping Configuration
aces:
  is_enable: false
  is_save: false
  is_debug: false
  is_plot_curve: false  # Set to true to plot and save the tone mapping curve
  # ACES variant: 'fitted' (faster, default) or 'full' (more accurate)
  variant: 'fitted'
  # Exposure adjustment in stops (0 = no adjustment)
  exposure_adjustment: 0.0
  # Output transform: 'sRGB' or 'Rec709'
  output_transform: 'sRGB'
